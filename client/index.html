<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search the iTunes catalogue, filter by media type and keep your favourites."
    />
    <title>iTunes Search</title>
    <script>
      // Runs before first paint, or a chosen light theme flashes dark while
      // the app boots. Nothing stored means the dark default in index.css.
      try {
        var stored = localStorage.getItem('itunes-search:theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {
        // Storage blocked, so the default stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
